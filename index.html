<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#00897B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MELHAT Dose Calculator</title>
<style>
:root {
  --primary: #00897B;
  --primary-light: #E0F2F1;
  --primary-dark: #005B4F;
  --accent: #FF6F00;
  --bg: #F5F7FA;
  --card: #FFFFFF;
  --text: #1A2332;
  --text-secondary: #5A6678;
  --border: #E2E8F0;
  --success: #2E7D32;
  --danger: #D32F2F;
  --shadow: 0 2px 8px rgba(0,0,0,0.08);
  --radius: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
a { text-decoration: none; color: inherit; }
button { cursor: pointer; border: none; background: none; font: inherit; }

.header { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: #fff; padding: 16px 20px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 12px rgba(0,137,123,0.3); }
.header h1 { font-size: 18px; font-weight: 600; letter-spacing: 0.3px; }
.header .back { display: inline-flex; align-items: center; gap: 6px; color: rgba(255,255,255,0.85); font-size: 14px; margin-bottom: 4px; }
.header .back:hover { color: #fff; }

.home { padding: 16px; max-width: 600px; margin: 0 auto; }
.section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; color: var(--primary); margin: 20px 0 10px; padding-left: 4px; }
.section-title:first-child { margin-top: 0; }
.nav-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; margin-bottom: 12px; }
.nav-item { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-bottom: 1px solid var(--border); transition: background 0.15s; }
.nav-item:last-child { border-bottom: none; }
.nav-item:hover { background: var(--primary-light); }
.nav-item .icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
.nav-item .label { flex: 1; font-size: 15px; font-weight: 500; }
.nav-item .arrow { color: var(--text-secondary); font-size: 18px; }

.drug-list-wrap { padding: 0 16px 16px; }
.search-box { margin: 16px; position: relative; }
.search-box input { width: 100%; padding: 12px 16px 12px 42px; border: 2px solid var(--border); border-radius: 25px; font-size: 15px; outline: none; transition: border-color 0.2s; background: var(--card); }
.search-box input:focus { border-color: var(--primary); }
.search-box .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); font-size: 18px; }
.drug-grid { display: grid; gap: 8px; }
.drug-item { background: var(--card); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 12px; transition: transform 0.15s, box-shadow 0.15s; cursor: pointer; }
.drug-item:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,0,0,0.12); }
.drug-item .letter { background: var(--primary); color: #fff; width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; flex-shrink: 0; }
.drug-item .name { flex: 1; font-size: 14px; line-height: 1.4; }

.tool-grid { padding: 16px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; max-width: 600px; margin: 0 auto; }
.tool-card { background: var(--card); border-radius: var(--radius); padding: 20px 16px; box-shadow: var(--shadow); text-align: center; cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; }
.tool-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.12); }
.tool-card .tool-icon { font-size: 32px; margin-bottom: 8px; }
.tool-card .tool-name { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.3; }

.calc-page { padding: 16px; max-width: 600px; margin: 0 auto; }
.form-group { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
.form-label { display: block; font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
.form-input { width: 100%; padding: 12px 14px; border: 2px solid var(--border); border-radius: 8px; font-size: 16px; outline: none; transition: border-color 0.2s; }
.form-input:focus { border-color: var(--primary); }
.form-row { display: flex; gap: 10px; align-items: center; }
.form-row .form-input { flex: 1; }
.form-select { padding: 10px 12px; border: 2px solid var(--border); border-radius: 8px; font-size: 14px; background: #fff; outline: none; min-width: 90px; }
.form-select:focus { border-color: var(--primary); }
.radio-group { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
.radio-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border: 2px solid var(--border); border-radius: 8px; cursor: pointer; transition: all 0.15s; }
.radio-item:hover { border-color: var(--primary); background: var(--primary-light); }
.radio-item input[type="radio"] { width: 18px; height: 18px; accent-color: var(--primary); }
.radio-item label { font-size: 14px; flex: 1; cursor: pointer; }
.btn-row { display: flex; gap: 12px; margin-top: 8px; }
.btn { flex: 1; padding: 14px; border-radius: 10px; font-size: 15px; font-weight: 600; text-align: center; transition: all 0.15s; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-outline { background: #fff; color: var(--primary); border: 2px solid var(--primary); }
.btn-outline:hover { background: var(--primary-light); }
.converter-intro { background: var(--primary-light); border-radius: var(--radius); padding: 12px 16px; margin-bottom: 16px; font-size: 14px; color: var(--primary-dark); }
.brands { font-size: 13px; color: var(--text-secondary); margin-bottom: 12px; font-style: italic; }
.static-line { font-size: 14px; color: var(--text); margin-bottom: 8px; line-height: 1.5; padding: 8px 12px; background: #FFF8E1; border-radius: 6px; border-left: 3px solid var(--accent); }
.answer-section { margin-top: 16px; }
.answer-label { font-size: 13px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
.answer-box { background: var(--card); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); font-size: 15px; line-height: 1.6; }
.answer-box font[color="red"] { color: var(--danger) !important; }
.validation-msg { font-size: 13px; color: var(--danger); margin-top: 8px; }

.abbrev-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.abbrev-table th { background: var(--primary); color: #fff; padding: 10px 12px; text-align: left; font-weight: 600; }
.abbrev-table td { padding: 9px 12px; border-bottom: 1px solid var(--border); }
.abbrev-table tr:hover td { background: var(--primary-light); }

.info-screen { padding: 16px; max-width: 600px; margin: 0 auto; }
.info-screen p { margin-bottom: 12px; font-size: 14px; line-height: 1.7; color: var(--text); }
.info-screen a { color: var(--primary); }

.wfa-table { width: 100%; border-collapse: collapse; font-size: 12px; margin: 0 16px 16px; }
.wfa-table th { background: var(--primary); color: #fff; padding: 8px 4px; text-align: center; font-weight: 600; position: sticky; top: 0; }
.wfa-table td { padding: 6px 4px; text-align: center; border-bottom: 1px solid var(--border); }
.wfa-table tr:nth-child(even) td { background: #F8FAFC; }
.wfa-table tr:hover td { background: var(--primary-light); }
.wfa-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }

.footer { text-align: center; padding: 24px 16px; font-size: 12px; color: var(--text-secondary); }

.page { display: none; }
.page.active { display: block; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.page.active { animation: fadeIn 0.2s ease; }

input[type="date"] { font-family: inherit; }
.converter-active { border-color: var(--primary) !important; background: var(--primary-light) !important; }

/* Letter separator in drug list */
.letter-sep { font-size: 12px; font-weight: 700; color: var(--primary); margin: 8px 0 4px; padding-left: 4px; }

@media (max-width: 380px) {
  .tool-grid { grid-template-columns: 1fr; }
  .form-row { flex-direction: column; }
  .form-select { min-width: unset; width: 100%; }
}

</style>
</head>

// ── DOM stub for vendor JavaScript ─────────────────────────────────────────
class DocStub {
  constructor(store, html) {
    this._s = store; this._h = html;
  }
  getElementById(id) {
    const s = this._s, h = this._h;
    return {
      get value() {
        const v = s[id];
        if (v === null || v === undefined) return '';
        if (typeof v === 'boolean') return v ? 'true' : 'false';
        return String(v);
      },
      set value(x) { s[id] = typeof x === 'string' ? x : String(x); },
      get checked() { return s['#' + id] === true; },
      set innerHTML(x) { h[id] = typeof x === 'string' ? x : String(x); },
    };
  }
}

// ── Message overrides (website -> app binary wording) ────────────────────────
function applyAppMessages(html, weightRaw) {
  if (!html) return html;
  let s = html;
  const wc = "Patient's weight is too low or invalid!";
  if (s.includes(wc)) {
    const n = parseFloat(weightRaw);
    const invalid = weightRaw == null || weightRaw === '' || isNaN(n);
    s = s.replace(wc, invalid
      ? "Patient's weight is invalid!"
      : "Patient's weight is too low!");
  }
  const rc = 'Please review the age, weight and serum creatinine value and enter a valid number(s)!';
  s = s.replace(/Please review the (age|weight|serum creatinine) value and enter a valid number!/g, rc);
  const ivc = 'Please review the volume, drop factor and time values!';
  s = s.replace(/Please review the (volume|drop factor|time) value!/g, ivc);
  s = s.replace('Please check the dates and try again!', 'Please review the start and end dates!');
  s = s.replace('The interval between the two dates is <strong>', 'The interval between the two dates is: <strong>');
  s = s.replace('</strong>day(s).', '</strong> day(s)');
  s = s.replace('IV Drip Rate = <strong>', 'IV Drip Rate: <strong>');
  s = s.replace(
    'Malarone Pediatric is not recommended for children weighing less than 11 kg.',
    'Malarone Pediatric is not recommended for children weighing less than 11 kg!');
  return s;
}

-dose-calc": {"title": "Rx Dose Calc! Calculate Pediatric Drug Dosages in Seconds!", "text": "Calculate Pediatric Drug Doses! RxDoseCalc is a medical tool to help doctors, pharmacists, dentists, nurses and other healthcare professionals calculate the pediatric drug dosages based on the weight or the age of the patient.\nCalculate Pediatric Dosages\n3 easy steps to use the pediatric dose calculator\nStep 1 : Go to the Drug List (A-Z) page and choose the medication and strength from the list\nStep 2 : Enter the patient's weight either in kilograms or in pounds to calculate pediatric drug dosage\nStep 3 : With one click Rxdosecalc will convert the weight between pounds and kilograms, calculate the pediatric drug doses, check the drug maximum dose, and display the final dose in both milliliters and milligrams\nClick Here To Start Calculation\nWe constantly add new drugs to our Drug List page, so please visit it regularly for updates.\nEven more free Tools\nRx Abbreviations: List of commonly used prescription Latin abbreviations with English and French meaning.\nAverage weight for age: Average weight for boys and girls from birth to 10 years old as per the WHO Reference 2007.\nBody Mass Index Calculator: Calculate BMI using body mass and height.\nBody Surface Area Calculator: BSA is used in many measurements in medicine, including the calculation of drug dosages and the amount of fluids to be administered IV.\nRenal Function Calculator: Calculation using Cockcroft-Gault equation, Modification of Diet in Renal Disease (MDRD) equation and CKD-EPI Equation.\nIV Drip Rate Calculator: Calculates IV infusion rate using drop counting per minute.\nModified Fagerstr\u00f6m Test: Assess the intensity of physical addiction to nicotine. It helps clinicians evaluate dependence levels and guide smoking cessation strategies.\nBlood Sugar Converter: Convert between mg/dL and mmol/L blood glucose values.\nWeight Converter: Convert between Kilograms and Pounds values.\nTemperature Convert function buildSource(page) {
  if (!page || !page.entry) return '';
  const lines = [];
  for (const f of page.functions) {
    if (f.name === page.entry.name) continue;
    lines.push('function ' + f.name + '(' + f.params + ') {' + f.body + '}');
  }
  lines.push('function ' + page.entry.name + '(' + page.entry.params + ') {' + page.entry.body + '}');
  return lines.join('\n') + '\n';
}

    const emoji = icon.startsWith('icon_') ? icon.substring(5) : icon;
    html += `<div class="nav-item" onclick="navigate('${route}')">` +
      `<div class="icon" style="background:${bg}">${emoji}</div>` +
      `<div class="label">${esc(label)}</div>` +
      `<div class="arrow">&#10095;</div></div>`;
  });
  html += '</div>';
  return html;
}

function renderDrugList() {
  const drugs = APP_DATA.routes.filter(r => r.kind === 'drug')
    .sort((a,b) => a.displayTitle.toLowerCase().localeCompare(b.displayTitle.toLowerCase()));
  let html = '<div class="search-box"><span class="search-icon">&#128269;</span>' +
    '<input id="drugSearch" type="text" placeholder="Search drug list..." oninput="filterDrugs(this.value)"></div>';
  html += '<div class="drug-list-wrap"><div class="drug-grid" id="drugList">';
  let lastLetter = '';
  for (const d of drugs) {
    const letter = d.displayTitle[0].toUpperCase();
    if (letter !== lastLetter) {
      html += `<div class="letter-sep">${letter}</div>`;
      lastLetter = letter;
    }
    html += `<div class="drug-item drug-row" data-title="${esc(d.displayTitle+' '+d.title+' '+d.route).toLowerCase()}" onclick="navigate('${esc(d.route)}')">` +
      `<div class="letter">${letter}</div>` +
      `<div class="name">${esc(d.displayTitle)}</div></div>`;
  }
  html += '</div></div>';
  html += '<div class="footer">Showing ' + drugs.length + ' pediatric dosage calculators</div>';
  return html;
}

function filterDrugs(q) {
  q = q.toLowerCase().trim();
  document.querySelectorAll('.drug-row').forEach(el => {
    el.style.display = (!q || el.dataset.title.includes(q)) ? '' : 'none';
  });
}

function renderCalculator(route) {
  const entry = getRoute(route);
  if (!entry) return '<div class="calc-page"><p>Page not found</p></div>';
  const page = getPage(entry.slug);
  if (!page) return '<div class="calc-page"><p>Page not found</p></div>';
  const isDrug = entry.kind === 'drug';
  const isKeyup = KEYUP_PAGES.has(entry.slug);
  const intro = CONVERTER_INTRO[entry.slug] || '';
  const unitSelects = {};
  for (const s of page.selects) {
    if (UNIT_PAIRS[s.id]) unitSelects[s.id] = s;
  }
  const pairedUnits = new Set(Object.keys(UNIT_PAIRS));
  const choiceSelects = page.selects.filter(s => !pairedUnits.has(s.id));

  let html = '<div class="calc-page">';
  if (page.brands && page.brands.length) {
    html += `<div class="brands">(Brand Name: ${esc(page.brands.join('; '))})</div>`;
  }
  for (const line of (page.staticLines || [])) {
    html += `<div class="static-line">${esc(line)}</div>`;
  }

  for (const inp of page.inputs) {
    const unitSel = unitSelects[inp.id];
    const isDate = inp.type === 'date';
    const label = isDrug && inp.id === 'weight' ? "PATIENT'S WEIGHT" : (INPUT_LABELS[inp.id] || inp.label);
    html += '<div class="form-group">';
    html += `<label class="form-label">${esc(label)}</label>`;
    if (unitSel) {
      html += '<div class="form-row">';
      html += `<input class="form-input calc-input" id="${esc(inp.id)}" type="${isDate ? 'date' : 'text'}" inputmode="${isDate ? 'none' : 'decimal'}" data-id="${esc(inp.id)}">`;
      html += `<select class="form-select" id="${esc(unitSel.id)}" onchange="onUnitChange('${esc(inp.id)}','${esc(unitSel.id)}')">`;
      for (const o of unitSel.options) {
        const lbl = (SELECT_LABELS[unitSel.id] || {})[o.value] || o.label || o.value;
        html += `<option value="${esc(o.value)}"${o.selected ? ' selected' : ''}>${esc(lbl)}</option>`;
      }
      html += '</select></div>';
    } else {
      html += `<input class="form-input calc-input" id="${esc(inp.id)}" type="${isDate ? 'date' : 'text'}" inputmode="${isDate ? 'none' : 'decimal'}" data-id="${esc(inp.id)}">`;
    }
    html += '</div>';
  }

  for (const sel of choiceSelects) {
    html += '<div class="form-group">';
    html += `<label class="form-label">${esc(sel.label || sel.id)}</label>`;
    html += `<select class="form-select" id="${esc(sel.id)}" style="width:100%">`;
    for (const o of sel.options) {
      html += `<option value="${esc(o.value)}"${o.selected ? ' selected' : ''}>${esc(o.label || o.value)}</option>`;
    }
    html += '</select></div>';
  }

  if (page.radios.length) {
    html += '<div class="form-group">';
    html += '<label class="form-label">Dosage Schedule</label>';
    html += '<div class="radio-group">';
    for (const r of page.radios) {
      html += `<div class="radio-item"><input type="radio" name="doseSchedule" id="rd_${esc(r.id)}" value="${esc(r.id)}"${r.checked ? ' checked' : ''} onchange="onRadioChange()"><label for="rd_${esc(r.id)}">${esc(r.label || r.id)}</label></div>`;
    }
    html += '</div></div>';
  }

  if (!isKeyup) {
    html += '<div class="btn-row">';
    html += `<button class="btn btn-primary" onclick="calculate('${esc(entry.slug)}')">CALCULATE</button>`;
    html += `<button class="btn btn-outline" onclick="resetForm('${esc(entry.slug)}')">RESET</button>`;
    html += '</div>';
  }

  html += '<div class="answer-section">';
  html += '<div class="answer-label">Answer</div>';
  html += '<div class="answer-box" id="answer"></div>';
  html += '<div class="validation-msg" id="validation"></div>';
  html += '</div>';
  html += '</div>';
  return html;
}

function renderAbbreviations() {
  const rows = APP_DATA.abbreviations;
  if (!rows.length) return '<div class="info-screen"><p>No abbreviations available.</p></div>';
  const header = rows[0];
  const data = rows.slice(1);
  let html = '<div class="info-screen"><table class="abbrev-table"><thead><tr>';
  for (const h of header) html += `<th>${esc(h)}</th>`;
  html += '</tr></thead><tbody>';
  for (const r of data) {
    html += '<tr>';
    for (let i = 0; i < r.length; i++) html += `<td>${esc(r[i])}</td>`;
    html += '</tr>';
  }
  html += '</tbody></table></div>';
  return html;
}

function renderDisclaimer() {
  const text = 'Calculations must be re-checked and should not be used alone to guide patient care, nor should they substitute for clinical judgment. The shown results can be different from the calculated results because of rounding.';
  return `<div class="info-screen"><p>${esc(text)}</p></div>`;
}

function renderInfo(slug) {
  const text = APP_DATA.info[slug];
  if (!text) return '<div class="info-screen"><p>Page not found.</p></div>';
  const formatted = esc(text).replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/\n/g, '<br>');
  return `<div class="info-screen">${formatted}</div>`;
}

function renderWeightForAge() {
  const rows = APP_DATA.weightForAge;
  if (!rows.length) return '<div class="info-screen"><p>No data available.</p></div>';
  const header = rows[0];
  const data = rows.slice(1);
  let html = '<div class="info-screen"><div class="wfa-scroll"><table class="wfa-table"><thead><tr>';
  for (const h of header) html += `<th>${esc(h)}</th>`;
  html += '</tr></thead><tbody>';
  for (const r of data) {
    html += '<tr>';
    for (let i = 0; i < r.length; i++) html += `<td>${esc(r[i])}</td>`;
    html += '</tr>';
  }
  html += '</tbody></table></div></div>';
  return html;
}

// ── Calculation ──────────────────────────────────────────────────────────────

function calculate(slug) {
  const page = getPage(slug);
  if (!page || !page.entry) return;
  const source = buildSource(page);
  if (!source) return;
  const store = collectStore();
  const htmlMap = {};
  const doc = new DocStub(store, htmlMap);
  try {
    const fn = new Function('document', source + '\nreturn ' + page.entry.name + ';')(doc);
    if (typeof fn === 'function') fn();
    const raw = htmlMap['answer'] || '';
    const wRaw = store['weight'];
    document.getElementById('answer').innerHTML = applyAppMessages(raw, wRaw);
    document.getElementById('validation').textContent = '';
  } catch (e) {
    document.getElementById('answer').innerHTML = '<font style="color:red">Calculation unavailable: ' + esc(String(e)) + '</font>';
  }
}

function resetForm(slug) {
  const page = getPage(slug);
  if (!page) return;
  for (const inp of page.inputs) {
    const el = document.getElementById(inp.id);
    if (el) el.value = '';
  }
  for (const sel of page.selects) {
    const el = document.getElementById(sel.id);
    if (el) {
      const def = sel.options.find(o => o.selected);
      el.value = def ? def.value : (sel.options[0] ? sel.options[0].value : '');
    }
  }
  for (const r of page.radios) {
    const el = document.getElementById('rd_' + r.id);
    if (el) el.checked = r.checked;
  }
  document.getElementById('answer').innerHTML = '';
  document.getElementById('validation').textContent = '';
}

function collectStore() {
  const store = {};
  document.querySelectorAll('.calc-input').forEach(el => { store[el.id] = el.value; });
  document.querySelectorAll('.form-select').forEach(el => { store[el.id] = el.value; });
  document.querySelectorAll('input[type="radio"]:checked').forEach(el => {
    store['#' + el.id.replace('rd_','')] = true;
  });
  return store;
}

function onUnitChange(inputId, unitId) {
  const slug = location.hash.replace('#','');
  if (KEYUP_PAGES.has(slug)) calculate(slug);
}

function onRadioChange() {
  const slug = location.hash.replace('#','');
  if (KEYUP_PAGES.has(slug)) calculate(slug);
}

// ── Router ───────────────────────────────────────────────────────────────────

function render() {
  const hash = (location.hash || '#').replace('#','') || '/';
  const path = hash.startsWith('/') ? hash : '/' + hash;
  let content = '', title = 'MELHAT Dose Calculator', showBack = false;

  if (path === '/' || path === '') {
    content = renderHome();
  } else if (path === '/druglist') {
    content = renderDrugList();
    title = 'Drug List';
    showBack = true;
  } else if (path === '/abbreviations') {
    content = renderAbbreviations();
    title = 'Rx Abbreviations';
    showBack = true;
  } else if (path === '/disclaimer') {
    content = renderDisclaimer();
    title = 'Disclaimer';
    showBack = true;
  } else if (path === '/references') {
    content = renderInfo('links-and-references');
    title = 'References';
    showBack = true;
  } else if (path === '/weightForAge') {
    content = renderWeightForAge();
    title = 'Average Weight for Age';
    showBack = true;
  } else {
    const entry = getRoute(path);
    if (entry) {
      if (entry.kind === 'static') {
        content = renderInfo(entry.slug);
        title = entry.displayTitle;
        showBack = true;
      } else {
        content = renderCalculator(path);
        title = entry.displayTitle;
        showBack = true;
      }
    } else {
      content = '<div class="info-screen"><p>Page not found.</p></div>';
      title = 'Not Found';
    }
  }

  document.getElementById('app-title').textContent = title;
  document.getElementById('back-btn').style.display = showBack ? '' : 'none';
  document.getElementById('main-content').innerHTML = content;
  window.scrollTo(0, 0);
}

window.navigate = navigate;
window.calculate = calculate;
window.resetForm = resetForm;
window.addEventListener('hashchange', render);
window.addEventListener('load', render);

</script>
